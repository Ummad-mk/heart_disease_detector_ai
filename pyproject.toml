[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name        = "ml-assignment"
version     = "1.0.0"
description = "ML Assignment 2 – Titanic Survival & Heart Disease Prediction"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn==1.9.1",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "joblib==1.6.0",
    "pandas==2.2.3",
    "seaborn==0.13.2",
    "matplotlib==3.11.2",
    "streamlit==1.45.1",
]

[project.scripts]
train-titanic       = "scripts.train_titanic:main"
train-heart-disease = "scripts.train_heart_disease:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v"
